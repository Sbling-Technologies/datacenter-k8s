loki:
  auth_enabled: false
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  ingester:
    chunk_encoding: snappy
  pattern_ingester:
    enabled: true
  querier:
    # Default is 4, if you have enough memory and CPU you can increase, reduce if OOMing
    max_concurrent: 4
  compactor:
    retention_enabled: true
    delete_request_store: s3
    retention_delete_delay: 5m
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 168h # 7 days

deploymentMode: SimpleScalable

backend:
  replicas: 2
read:
  replicas: 2
write:
  replicas: 3 # To ensure data durability with replication

monitoring:
  dashboards:
    enabled: true
    grafanaOperator:
      enabled: true
      folder: Loki
      instanceSelector:
        matchLabels:
          dashboards: grafana
  rules:
    enabled: true
  alerts:
    enabled: true
  serviceMonitor:
    enabled: true

# TODO: Swap out for something else, will be removed in loki 20.0.0
ignoreMinioDeprecation: true
minio:
  enabled: true
  image:
    repository: docker.io/pgsty/silo
    tag: RELEASE.2026-10-26T00-00-00Z@sha256:7bb2aff6b89efe1cb1303c10fc21d579447434ed06649ac9ec05a5e2dbf30ad7
  mcImage:
    repository: docker.io/pgsty/mc
    tag: RELEASE.2026-10-26T00-00-00Z@sha256:ce62c9053c69ce12a527a322345b5ad9f44b5f8a7b8189f82e516f2e3f30f1d8

  persistence:
    size: 30Gi
