grafana:
  enabled: false
  forceDeployDashboards: true
  operator:
    dashboardsConfigMapRefEnabled: true
    folder: Kubernetes Default
    matchLabels:
      dashboards: grafana

nodeExporter:
  operatingSystems:
    aix:
      enabled: false
    darwin:
      enabled: false

kubeControllerManager:
  endpoints:
    - 172.31.50.48
    - 172.31.50.49
    - 172.31.50.50

kubeEtcd:
  endpoints:
    - 172.31.50.48
    - 172.31.50.49
    - 172.31.50.50

kubeScheduler:
  endpoints:
    - 172.31.50.48
    - 172.31.50.49
    - 172.31.50.50

# NOTE: Replaced by Cilium
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    replicas: 2
    enableFeatures:
      - exemplar-storage
    retentionSize: 40GiB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-single-replica
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false

alertmanager:
  alertmanagerSpec:
    replicas: 2
    secrets:
      - inchident-bot-secret
      - healthcheck-io-webhook

  config:
    route:
      receiver: "null"
      routes:
        - receiver: healthcheck-io-webhook
          group_interval: 1m
          repeat_interval: 50s
          group_wait: 0s
          matchers:
            - alertname = "Watchdog"
        # group_by a label no alert has puts every alert in one group, so each message can list the others still firing.
        # severity "none" is only Watchdog/InfoInhibitor, which exist for plumbing, not for people.
        - receiver: inchident-telegram-receiver
          group_by: ["single_group"]
          matchers:
            - severity != "none"
    receivers:
      - name: "null"
      - name: inchident-telegram-receiver
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/inchident-bot-secret/token
            chat_id: -1001844822513
            message: '{{ template "telegram.message" . }}'
      - name: healthcheck-io-webhook
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/healthcheck-io-webhook/url

  templateFiles:
    telegram_template.tmpl: |-
      {{- /* "<severity emoji> AlertName (namespace/target)", target = first identifying label present */ -}}
      {{- define "__alert" -}}
      {{- $s := .Labels.severity -}}
      {{ if eq $s "critical" }}🔴{{ else if eq $s "warning" }}🟠{{ else if eq $s "info" }}🔵{{ else }}⚪{{ end }} <b>{{ .Labels.alertname }}</b>
      {{- $t := "" -}}
      {{- range (stringSlice "pod" "deployment" "statefulset" "daemonset" "job_name" "persistentvolumeclaim" "service" "node" "instance" "job") -}}
      {{- if and (not $t) (index $.Labels .) }}{{ $t = index $.Labels . }}{{ end -}}
      {{- end -}}
      {{- $ns := .Labels.namespace -}}
      {{- if or $ns $t }} ({{ $ns }}{{ if and $ns $t }}/{{ end }}{{ $t }}){{ end -}}
      {{- end -}}

      {{- /* shortcut: "new" = started less than group_interval (5m) ago; Alertmanager does not say which alerts are new. */ -}}
      {{- define "telegram.message" -}}
      {{- $new := false }}{{ $old := false -}}
      {{- range .Alerts.Firing }}{{ if lt (since .StartsAt).Minutes 5.0 }}{{ $new = true }}{{ else }}{{ $old = true }}{{ end }}{{ end -}}
      {{- if $new }}🚨 New alert firing:
      {{ range .Alerts.Firing }}{{ if lt (since .StartsAt).Minutes 5.0 }}
      {{ template "__alert" . }}{{ end }}{{ end }}

      {{ end -}}
      {{- if .Alerts.Resolved }}✅ Alert resolved:
      {{ range .Alerts.Resolved }}
      {{ template "__alert" . }}{{ end }}

      {{ end -}}
      {{- if $old }}Other alerts still firing:
      {{ range .Alerts.Firing }}{{ if not (lt (since .StartsAt).Minutes 5.0) }}
      - {{ template "__alert" . }}{{ end }}{{ end }}
      {{- else }}No other alerts firing.{{ end -}}
      {{- end -}}
