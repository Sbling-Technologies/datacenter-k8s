apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - base/secrets.yaml
  # HACK: TCPRoute and UDPRoute were promoted to stable in Gateway API 1.6.0, external-dns still expects the v1alpha2 versions.
  # see: https://github.com/kubernetes-sigs/external-dns/issues/6247
  - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.6.2/config/crd/experimental/gateway.networking.k8s.io_tcproutes.yaml
  - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.6.2/config/crd/experimental/gateway.networking.k8s.io_udproutes.yaml

helmCharts:
  - repo: https://kubernetes-sigs.github.io/external-dns/
    name: external-dns
    releaseName: external-dns
    version: 1.22.0
    valuesFile: values.yaml
    namespace: external-dns

images:
  - name: ghcr.io/kashalls/external-dns-unifi-webhook
    newTag: v0.9.0@sha256:22f4106f44a0b9ac3c97cf29bbfef93026c1164492152dc797a1d6dc86ddfbb5
