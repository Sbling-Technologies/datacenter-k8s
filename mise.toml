# Tools used by the Justfile, pre-commit hooks and CI; Renovate keeps them updated.
[tools]
go = "1.27.4"
# cmd/kro is a nested Go module without its own tags: pin the commit of the kro release deployed in platform/kro.
"go:github.com/kubernetes-sigs/kro/cmd/kro" = "3bc58f0e76d9ed57c286696f178058752458134e" # v0.10.0
helm = "4.3.2"
jq = "1.8.2"
just = "1.59.0"
kubeconform = "0.8.0"
kustomize = "5.8.3"
prek = "0.5.12"
uv = "0.13.10"
yq = "4.54.3"
